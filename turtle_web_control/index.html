<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleControl Pro | ROS2 Web Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
</head>

<body>
    <div class="glass-container">
        <header>
            <h1>TurtleControl <span class="accent">Pro</span></h1>
            <div id="status-badge" class="badge disconnected">Disconnected</div>
        </header>

        <main>
            <section class="connection-panel">
                <div class="input-group">
                    <label for="ros-url">ROSBridge WebSocket URL</label>
                    <input type="text" id="ros-url" value="ws://192.168.1.9:9090" placeholder="ws://192.168.1.9:9090">
                </div>
                <button id="connect-btn" class="primary-btn">Connect to Robot</button>
            </section>

            <section class="control-panel">
                <div class="joystick-grid">
                    <div class="spacer"></div>
                    <button class="control-btn" id="up" title="Move Forward">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19V5M5 12l7-7 7 7" />
                        </svg>
                    </button>
                    <div class="spacer"></div>

                    <button class="control-btn" id="left" title="Rotate Left">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button class="control-btn stop-btn" id="stop" title="Emergency Stop">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        </svg>
                    </button>
                    <button class="control-btn" id="right" title="Rotate Right">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>

                    <div class="spacer"></div>
                    <button class="control-btn" id="down" title="Move Backward">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12l7 7 7-7" />
                        </svg>
                    </button>
                    <div class="spacer"></div>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <span class="label">Linear Vel</span>
                        <span id="lin-val" class="value">0.00</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Angular Vel</span>
                        <span id="ang-val" class="value">0.00</span>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Ready to transmit to <code>/turtle1/cmd_vel</code></p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
